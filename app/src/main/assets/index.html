<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launcher 207</title>
<style>
:root{--bg:#070b16;--panel:#111a2e;--line:#22304f;--txt:#e8ecf6;--dim:#8d9bbb;--warn:#ffb020;--ok:#3ddc97}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:64px 1fr 1fr;gap:12px;padding:12px}
.side{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--panel);border-radius:20px;padding:10px 6px}
.side b{font-size:13px;margin-bottom:6px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;cursor:pointer;color:#fff}
.sc{display:flex;flex-direction:column;gap:10px}
.ic.ed{background:#0c1426;color:var(--dim);font-size:18px;margin-top:auto}
.edit .sc .ic{outline:2px dashed var(--warn);outline-offset:2px}
.center{position:relative;display:flex;flex-direction:column;min-height:0;background:radial-gradient(ellipse at 50% 70%,#16264a 0%,var(--panel) 55%,var(--bg) 100%);border-radius:24px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;z-index:2;pointer-events:none}
.head>*{pointer-events:auto}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.st{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--dim);margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.o{background:var(--warn)}
.sw{display:flex;gap:8px}
.sw i{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw i.on{border-color:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{display:flex;gap:6px;padding:10px 12px 14px;z-index:2;flex-wrap:nowrap;justify-content:center;margin-top:auto}
.bar button{background:#0c1426cc;border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.bar button.on{border-color:var(--warn);color:var(--warn)}
.right{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--panel);border-radius:20px;padding:14px}
.media{display:flex;gap:12px;align-items:center}
.art{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#ff7a59,#8a3ffc);display:grid;place-items:center;font-size:28px}
.media small{color:var(--dim)}
.ctl{display:flex;justify-content:space-around;margin-top:10px;font-size:22px;color:var(--dim)}
.clock{font-size:40px;font-weight:700;line-height:1}
.date{color:var(--dim);font-size:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid div{background:#0c1426;border-radius:12px;padding:8px 10px}
.grid small{display:block;color:var(--dim);font-size:11px}
.grid span{font-size:18px;font-weight:600}
.pk{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.pk[hidden]{display:none}
.pk .box{background:var(--panel);border-radius:20px;padding:16px;max-width:92%;max-height:90%;overflow:auto}
.pk h2{margin:0 0 10px;font-size:16px}
.pk .g{display:grid;grid-template-columns:repeat(5,76px);gap:10px}
.pk .g div{text-align:center;font-size:11px;color:var(--dim);cursor:pointer;overflow:hidden}
.pk .g .ic{margin:0 auto 4px}
@media (orientation:portrait){.sc{flex-direction:row}.ic.ed{margin:0}
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;overflow:auto}
 .side{flex-direction:row;justify-content:center;padding:6px}.side b{display:none}
 .center{height:62vh}.right{flex-direction:row;flex-wrap:wrap}.right .card{flex:1 1 240px}}
@media (max-height:500px){.head{padding:8px 14px}.head h1{font-size:18px}.bar{padding:6px 10px 8px}.bar button{padding:6px 8px;font-size:11px}.sw i{width:18px;height:18px}.sw{gap:6px}.clock{font-size:32px}.card{padding:10px}.app{gap:8px;padding:8px}.side{gap:6px}.sc{gap:6px}.ic{width:40px;height:40px;font-size:19px}.pk .g{grid-template-columns:repeat(5,64px)}}
</style>
</head>
<body>
<div class="app">
 <div class="side" id="rail"><b id="t1">16:59</b><div class="sc" id="sc"></div><div class="ic ed" id="ed">✎</div></div>
 <div class="center">
  <div class="head">
   <div><h1>Peugeot 207</h1><div class="st"><span class="dot" id="dot"></span><span id="stx">Tout est fermé</span></div></div>
   <div class="sw" id="sw"></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="bar" id="bar"></div>
 </div>
 <div class="right">
  <div class="card"><div class="media"><div class="art">♪</div><div><b>Aucune lecture</b><br><small>Bluetooth</small></div></div><div class="ctl"><span>⏮</span><span>▶</span><span>⏭</span></div></div>
  <div class="card"><div class="clock" id="t2">16:59</div><div class="date" id="dt"></div>
   <div class="grid"><div><small>Ext.</small><span>8,5°</span></div><div><small>Batterie</small><span>12,3 V</span></div><div><small>Carburant</small><span>38 L</span></div><div><small>Régime</small><span id="rpm">0</span></div></div></div>
 </div>
</div>
<div class="pk" id="pk" hidden><div class="box"><h2>Choisir une application</h2><div class="g" id="pg"></div></div></div>
<script src="three.min.js"></script>
<script>
var cv=document.getElementById('cv'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);
cam.position.set(0,2.6,8);cam.lookAt(0,-.1,0);
scene.add(new THREE.AmbientLight(0xaab8ff,.7));
var dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(4,8,5);scene.add(dl);
var pl=new THREE.PointLight(0x5b8cff,1.2,20);pl.position.set(-3,2,-3);scene.add(pl);
var rig=new THREE.Group();scene.add(rig);
var plat=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.12,64),new THREE.MeshStandardMaterial({color:0x0d1426,metalness:.6,roughness:.4}));plat.position.y=-.06;scene.add(plat);
var ring=new THREE.Mesh(new THREE.TorusGeometry(3.4,.03,8,96),new THREE.MeshBasicMaterial({color:0x5b8cff}));ring.rotation.x=Math.PI/2;scene.add(ring);
var paint=new THREE.MeshStandardMaterial({color:0x3a6df0,metalness:.7,roughness:.25});
var glass=new THREE.MeshStandardMaterial({color:0x0a1226,metalness:.9,roughness:.1});
var dark=new THREE.MeshStandardMaterial({color:0x05070d,roughness:.8});
function box(w,h,d,m,x,y,z,p){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x||0,y||0,z||0);(p||rig).add(o);return o}
box(4,.6,1.7,paint,0,.6,0);
box(2.1,.55,1.5,glass,-.25,1.15,0);
box(1.9,.06,1.4,paint,-.25,1.45,0);
box(.1,.14,1.3,new THREE.MeshBasicMaterial({color:0xfff4c2}),2.02,.7,0);
box(.1,.14,1.3,new THREE.MeshBasicMaterial({color:0xff2d3d}),-2.02,.75,0);
[[1.25,.85],[1.25,-.85],[-1.25,.85],[-1.25,-.85]].forEach(function(p){
 var w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.26,24),dark);w.rotation.x=Math.PI/2;w.position.set(p[0],.36,p[1]);rig.add(w);
 var r=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.28,16),new THREE.MeshStandardMaterial({color:0xbfc8e0,metalness:.9,roughness:.3}));r.rotation.x=Math.PI/2;r.position.set(p[0],.36,p[1]);rig.add(r)});
var parts={};
function door(k,hx,side,off){var g=new THREE.Group();g.position.set(hx,.95,side*.87);rig.add(g);box(.9,.55,.06,paint,off,0,0,g);box(.7,.28,.07,glass,off,.28,0,g);parts[k]={g:g,cur:0,tgt:0,ax:'y',ang:side*.95}}
door('avg',.55,1,-.45);door('avd',.55,-1,-.45);door('arg',-.35,1,-.45);door('ard',-.35,-1,-.45);
var cap=new THREE.Group();cap.position.set(.95,.92,0);rig.add(cap);box(1.05,.07,1.6,paint,.52,0,0,cap);parts.capot={g:cap,cur:0,tgt:0,ax:'z',ang:.9};
var cof=new THREE.Group();cof.position.set(-2,1.25,0);rig.add(cof);box(.07,.6,1.4,paint,0,-.3,0,cof);parts.coffre={g:cof,cur:0,tgt:0,ax:'z',ang:-1.05};
var names={avg:'Av. gauche',avd:'Av. droite',arg:'Ar. gauche',ard:'Ar. droite',coffre:'Coffre',capot:'Capot'};
var bar=document.getElementById('bar');
function setDoor(k,open){parts[k].tgt=open?1:0;var b=document.getElementById('b_'+k);if(b)b.classList.toggle('on',open);status()}
function status(){var o=Object.keys(parts).filter(function(k){return parts[k].tgt});
 document.getElementById('dot').className='dot'+(o.length?' o':'');
 document.getElementById('stx').textContent=o.length?(o.length==1?names[o[0]]+' ouvert(e)':o.length+' ouvrants ouverts'):'Tout est fermé'}
Object.keys(names).forEach(function(k){var b=document.createElement('button');b.id='b_'+k;b.textContent=names[k].replace('gauche','G').replace('droite','D');b.onclick=function(){setDoor(k,!parts[k].tgt)};bar.appendChild(b)});
var cols=[0x3a6df0,0xd8c43a,0xc0283a,0xe9edf5,0x1b1f2a],sw=document.getElementById('sw');
cols.forEach(function(c,i){var e=document.createElement('i');e.style.background='#'+c.toString(16).padStart(6,'0');if(!i)e.className='on';e.onclick=function(){paint.color.setHex(c);[].forEach.call(sw.children,function(x){x.className=''});e.className='on'};sw.appendChild(e)});
var drag=false,lx=0,rot=-.6,idle=0;
cv.onpointerdown=function(e){drag=true;lx=e.clientX;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=function(e){if(drag){rot+=(e.clientX-lx)*.01;lx=e.clientX;idle=0}};
cv.onpointerup=function(){drag=false};
function fit(){var w=cv.clientWidth,h=cv.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(cv);fit();
function loop(){idle++;if(!drag&&idle>120)rot+=.004;rig.rotation.y=rot;
 Object.keys(parts).forEach(function(k){var p=parts[k];p.cur+=(p.tgt-p.cur)*.12;p.g.rotation[p.ax]=p.cur*p.ang});
 ren.render(scene,cam);requestAnimationFrame(loop)}
loop();
function tick(){var d=new Date(),t=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('t1').textContent=t;document.getElementById('t2').textContent=t;
 document.getElementById('dt').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,10000);
/* Raccourcis modifiables */
var DEMO=[['Navigation','➤','#2f6bff'],['Musique','♪','#e5384f'],['Bluetooth','✱','#2f6bff'],['Radio','◎','#ff8a3d'],['Téléphone','☎','#3ddc97'],['YouTube','▶','#ff2d3d'],['Réglages','⚙','#6b7894']];
var ITEMS=[],REAL=false;
try{if(window.Android){JSON.parse(Android.apps()).forEach(function(a){ITEMS.push({k:a.pkg,l:a.label})});ITEMS.sort(function(a,b){return a.l.localeCompare(b.l)});REAL=ITEMS.length>0}}catch(e){}
if(!REAL)DEMO.forEach(function(d){ITEMS.push({k:d[0],l:d[0],i:d[1],c:d[2]})});
var slots=REAL?['','','','','']:['Navigation','Musique','Bluetooth','YouTube','Radio'];
try{var sv=JSON.parse(localStorage.getItem('slots207b'));if(sv&&sv.length==5)slots=sv}catch(e){}
var editing=false,pickIdx=-1,scEl=document.getElementById('sc'),pk=document.getElementById('pk'),pg=document.getElementById('pg');
function look(k){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].k==k)return ITEMS[i];return null}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'hsl('+h+',55%,42%)'}
function fillIc(d,it){if(it){d.style.background=it.c||hue(it.l);d.textContent=it.i||it.l.charAt(0).toUpperCase()}else{d.style.background='#1a2440';d.textContent='＋'}}
function drawSc(){scEl.innerHTML='';slots.forEach(function(k,i){var it=look(k),d=document.createElement('div');d.className='ic';fillIc(d,it);d.onclick=function(){
 if(editing){pickIdx=i;pk.hidden=false}else if(it&&REAL){try{Android.launch(it.k)}catch(e){}}};scEl.appendChild(d)})}
ITEMS.forEach(function(it){var c=document.createElement('div'),d=document.createElement('div');d.className='ic';fillIc(d,it);c.appendChild(d);c.appendChild(document.createTextNode(it.l));
 c.onclick=function(e){e.stopPropagation();slots[pickIdx]=it.k;try{localStorage.setItem('slots207b',JSON.stringify(slots))}catch(x){}pk.hidden=true;drawSc()};pg.appendChild(c)});
pk.onclick=function(){pk.hidden=true};
document.getElementById('ed').onclick=function(){editing=!editing;document.getElementById('rail').classList.toggle('edit',editing);this.textContent=editing?'✓':'✎'};
drawSc();
window.carData={setDoor:setDoor};
</script>
</body>
</html>
